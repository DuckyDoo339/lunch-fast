<div class="map-frame">
  <div class="map-tools">
    <span><app-icon name="location" /> OpenStreetMap · มหาสารคาม</span>
    <div>
      <button class="secondary small" (click)="retryRoads()"><app-icon name="refresh" /> ถนนจริง</button>&nbsp;
      <button class="secondary small" (click)="focusAll()"><app-icon name="target" /> รวมทุกจุด</button>&nbsp;
      <button class="secondary small" (click)="expand()"><app-icon name="expand" /> ขยายแผนที่</button>
    </div>
  </div>
  <div class="map leaflet-map" #mapEl [id]="mapId" aria-label="แผนที่จริงและจุดส่งอาหาร">
    <div class="map-no-service">กำลังเปิดแผนที่จริง…</div>
  </div>
  <div class="map-filter">
    @for (r of routes(); track r.rider) {
      <button (click)="focus(r.rider)">
        <i class="dot" [style.background]="colors[r.rider % 8]"></i>{{ riderName(r.rider) }} · {{ r.ids.length }} จุด
      </button>
    }
  </div>
  <div class="map-status" #statusEl [id]="mapId + '-status'">แผนที่จริง · ลูกค้าและร้านเป็นพิกัดตัวอย่าง · เส้นประ = ระยะเส้นตรงที่ยังไม่ยืนยัน</div>
</div>
